<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Games | Screw Puzzle</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #0062ff;
            --bg: #050a0f;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            /* Убираем жесткий hidden, чтобы можно было скроллить на мобилках */
            overflow-x: hidden;
            background: var(--bg);
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        #particles-js {
            position: fixed; /* Фиксируем фон */
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px 120px; /* Больше отступа снизу для мобильного футера */
            box-sizing: border-box;
            text-align: center;
            color: white;
            background: radial-gradient(circle at center, rgba(0, 242, 255, 0.05) 0%, transparent 70%);
        }

        .logo-box {
            position: relative;
            margin-bottom: 20px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 5rem); /* Гибкий размер шрифта */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: clamp(4px, 2vw, 10px);
            margin: 0;
            background: linear-gradient(to bottom, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.4));
        }

        .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.5rem);
            color: var(--primary);
            letter-spacing: clamp(2px, 1vw, 5px);
            margin-bottom: 30px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .description {
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            color: #a0adba;
            padding: 0;
        }

        .btn-glitch {
            position: relative;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            text-decoration: none;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border-radius: 8px;
            transition: 0.3s;
            overflow: hidden;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 98, 255, 0.4);
            display: inline-block;
        }

        .btn-glitch:active { transform: scale(0.95); } /* Эффект нажатия на тачскрине */

        .footer {
            position: relative; /* Относительное позиционирование для мобильных */
            margin-top: 50px;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-wrap: wrap; /* Чтобы ссылки переносились на вторую строку */
            justify-content: center;
            gap: 15px 30px;
            padding: 20px;
            box-sizing: border-box;
        }

        .footer a {
            color: #50667a;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer a:hover { color: var(--primary); }

        .corner-gear {
            position: fixed;
            width: 200px;
            height: 200px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%2300f2ff" opacity="0.05" d="M50 5l-5 5v10l5 5 5-5V10zM50 80l-5 5v10l5 5 5-5V85zM20 50l-5-5H5l-5 5 5 5h10zM80 50l-5-5h-10l-5 5 5 5h10z"/></svg>');
            background-size: contain;
            animation: rotate 20s linear infinite;
            z-index: 0;
            pointer-events: none; /* Чтобы шестеренки не мешали нажимать на кнопки */
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Планшеты и телефоны */
        @media (max-width: 768px) {
            .main-container { justify-content: flex-start; padding-top: 10vh; }
            .corner-gear { width: 150px; height: 150px; }
            .footer { position: relative; bottom: 0; }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>
    
    <div class="corner-gear" style="top: -50px; right: -50px;"></div>
    <div class="corner-gear" style="bottom: -80px; left: -80px; animation-direction: reverse;"></div>

    <div class="main-container">
        <div class="logo-box">
            <h1 class="title">VUE GAMES</h1>
            <div class="subtitle">The story begins right now</div>
        </div>

        <p class="description">
            Our first game is <strong>Screw Puzzle: Offline Games</strong>. <br><br>
            Immerse yourself in a fun nut and bolt sorting game. Enjoy a focused puzzle experience with wood and metal.
        </p>

        <a href="https://play.google.com/store/apps/details?id=com.vuegames.screwbust" class="btn-glitch">
            Google Play
        </a>

        <div class="footer">
            <a href="https://doc-hosting.flycricket.io/screw-bust-sort-jam-puzzle-privacy-policy/1df8fbe3-a114-4fc4-a13f-ebced46539e8/privacy">Privacy</a>
            <a href="app-ads.txt">Ads.txt</a>
            <a href="https://doc-hosting.flycricket.io/screw-puzzle-no-forced-ads-terms-of-use/c7cc1a60-adbe-429e-b328-4cf38ec2049e/terms">Terms</a>
            <span style="color: #304152; width: 100%; display: block;">&copy; 2026 VUE GAMES</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 40 }, /* Уменьшил число для мобильной производительности */
                "color": { "value": "#00f2ff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 3 },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#00f2ff",
                    "opacity": 0.2,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1.5,
                    "out_mode": "out"
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": false }, /* Отключил наведение, на мобилках оно глючит */
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
